name: crawl
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit index
        run: |
          git config user.name "pantheon-crawler"
          git config user.email "pantheon-crawler@users.noreply.github.com"
          git add index
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "index: $(date -u +%Y-%m-%dT%H:%MZ)"
          # The files are now at a commit; the manifest names it so every client reads them from
          # that immutable ref. jsDelivr caches branch paths long after the branch moved, and the
          # hash in the query never reaches it, so a rebuilt file came back stale for hours.
          node crawler/pin.mjs "$(git rev-parse HEAD)"
          git add index/manifest.json
          git commit -m "manifest: pin $(git rev-parse --short HEAD)"
          git push
      - name: purge jsDelivr manifest
        run: |
          # The manifest is the one file still read from the branch; it is purged, and checked.
          curl -fsS "https://purge.jsdelivr.net/gh/PEEPEEBOY69/pantheon-index@main/index/manifest.json" || true
          sleep 20
          want=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("index/manifest.json","utf8")).commit)')
          got=$(curl -fsS "https://cdn.jsdelivr.net/gh/PEEPEEBOY69/pantheon-index@main/index/manifest.json?t=$(date +%s)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).commit))')
          echo "manifest on CDN pins $got, wanted $want"
          [ "$got" = "$want" ] || echo "::warning::CDN still serves the previous manifest; clients fall back to raw GitHub until it catches up"
