name: crawl
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit index
        run: |
          git config user.name "pantheon-crawler"
          git config user.email "pantheon-crawler@users.noreply.github.com"
          git add index
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "index: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: purge jsDelivr manifest
        run: curl -fsS "https://purge.jsdelivr.net/gh/PEEPEEBOY69/pantheon-index@main/index/manifest.json" || true
